name: tekoha-build-data-check

# A dry run of the build-data path, on a push to the build-data branch only: the builders run on the restored export
# (ddvanlith/tekoha, branch build-data) exactly as pages.yml now runs them, and their output is compared file by file
# with the published gh-pages. Nothing is published and Supabase is not read.
on:
  push:
    branches: [build-data]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ddvanlith/tekoha
          ref: egress-build-data
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: code

      - uses: actions/checkout@v5
        with:
          repository: ddvanlith/tekoha
          ref: build-data
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: build-data

      - uses: actions/checkout@v5
        with:
          path: self

      # The stale-export guard exactly as pages.yml (this branch) and dashboard.yml (tekoha-daily, branch build-data) run
      # it: on the real export, and on a copy whose export time and run id are older than the newest pipeline run.
      - name: Stale-export guard, as the builds run it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yq '.jobs.pages.steps[] | select(.id == "fresh") | .run' self/.github/workflows/pages.yml > /tmp/fresh-pages.sh
          curl -fsSL https://raw.githubusercontent.com/ddvanlith/tekoha-daily/build-data/.github/workflows/dashboard.yml \
            | yq '.jobs.dashboard.steps[] | select(.id == "fresh") | .run' | sed 's#\$GITHUB_REPOSITORY#ddvanlith/tekoha-daily#' > /tmp/fresh-dash.sh
          mkdir -p /tmp/stale/build-data
          jq '.exported_at = "2026-11-01T00:00:00.000Z" | .pipeline_run = "1-1"' build-data/manifest.json > /tmp/stale/build-data/manifest.json
          for s in pages dash; do
            : > /tmp/out; GITHUB_OUTPUT=/tmp/out bash -eo pipefail /tmp/fresh-$s.sh; echo "$s, real export: $(cat /tmp/out)"
            : > /tmp/out; (cd /tmp/stale && GITHUB_OUTPUT=/tmp/out bash -eo pipefail /tmp/fresh-$s.sh); echo "$s, stale copy: $(cat /tmp/out)"
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install
        working-directory: code
        run: npm ci --no-audit --no-fund

      - name: Restore the build data
        working-directory: code
        run: |
          bash pipeline/build-data/postgis.sh
          PSQL="docker exec -i tekoha-pg psql -U postgres -d postgres -q" node pipeline/build-data/restore.mjs --dir "$GITHUB_WORKSPACE/build-data"

      - name: Build as pages.yml does
        working-directory: code
        env:
          DATABASE_URL: postgresql://tekoha_reader:tekoha@localhost:5432/postgres
          # Prints what each builder received from the database: what it would read from Supabase with the same rows.
          NODE_OPTIONS: --import=file://${{ github.workspace }}/code/pipeline/build-data/count-reads.mjs
          PAGES_DIR: /tmp/pages
          SITE_DIR: /tmp/pages
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEKOHA_PUBLIC_EMAIL: ${{ vars.TEKOHA_PUBLIC_EMAIL }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          REPORT_PAYMENT_LINK: ${{ vars.REPORT_PAYMENT_LINK }}
          PAGES_SITE_MB: ${{ vars.PAGES_SITE_MB }}
        run: |
          mask() { sed -E -u 's#postgres(ql)?://[^[:space:]]*#[connection string]#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g'; }
          node pipeline/property-pages.mjs 2>&1 | mask
          node pipeline/build-app.mjs 2>&1 | mask
          node pipeline/build-casa.mjs 2>&1 | mask
          node pipeline/build-compartir.mjs 2>&1 | mask

      - name: Compare with the published pages
        run: |
          git clone -q --depth 1 --branch gh-pages https://github.com/ddvanlith/tekoha-pages.git /tmp/published
          git -C /tmp/published log -1 --format='published: %h %cI %s'
          node code/pipeline/build-data/compare.mjs /tmp/pages /tmp/published --samples 2
          echo "Without the build's own clock (as_of):"
          node code/pipeline/build-data/compare.mjs /tmp/pages /tmp/published --samples 3 --ignore '"as_of":"[^"]*"' --copy /tmp/differ

      # Both sides of each file that still differs, kept one day: public pages only, the same files the site publishes.
      - uses: actions/upload-artifact@v4
        with:
          name: differing-files
          path: /tmp/differ
          retention-days: 1
          if-no-files-found: ignore
