<style>
:root{--bg:#fff;--ink:#1d1a16;--ink-2:#4f463b;--ink-3:#6f6556;--line:#e7e1d7;--panel:#f8f5ef;--panel-2:#f0ebe2;--gold:#a97e2f;--gold-ink:#7a5a1b;--ok:#1f6a45;--warn:#9c4315;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
a{color:var(--gold-ink)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto;padding:6px 12px 6px 16px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;color:var(--ink);text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.01em;min-height:44px}
.brand i{position:relative;width:28px;height:28px;border-radius:7px;background:var(--gold);flex:none}
.brand i::before{content:"";position:absolute;left:6px;top:6px;border:8px solid transparent;border-bottom:7px solid #fff;border-top:0}
.brand i::after{content:"";position:absolute;left:8px;top:13px;width:12px;height:9px;background:#fff}
.nav a,.nav button{display:inline-flex;align-items:center;min-height:44px;min-width:44px;justify-content:center;padding:0 9px;border:0;background:none;color:var(--ink-2);font-size:16px;text-decoration:none;cursor:pointer;border-radius:10px}
.nav .lang{border:1px solid var(--line);font-weight:700;font-size:14px;letter-spacing:.04em}
main{max-width:720px;margin:0 auto;padding:0 16px 40px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px}
h2{font-size:22px;line-height:1.2;margin:0 0 10px}
.rule{margin:0 0 18px;padding:14px 16px;border-left:4px solid var(--gold);background:var(--panel);font-size:19px;line-height:1.4}
.fld{display:block;margin:0 0 14px}
.lab{display:block;margin:0 0 6px;font-size:16px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;min-height:50px;padding:10px 12px;border:1px solid #c9bfb0;border-radius:10px;background:#fff;font-size:18px}
.inp:focus{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel-2);border-radius:12px}
.seg label{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(30,20,10,.14)}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.hint{margin:6px 0 0;font-size:15px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:1px solid #c9bfb0;border-radius:12px;background:#fff;color:var(--ink);font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;text-align:center}
.btn.pri{background:var(--gold-ink);border-color:var(--gold-ink);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.msg{min-height:24px;margin:10px 0 0;font-size:16px}
.msg.bad{color:var(--warn)}.msg.okm{color:var(--ok)}
.mylink{margin:0 0 12px;padding:14px;border:1px solid var(--line);border-radius:14px}
.mylink code{display:block;margin:4px 0 12px;padding:12px;border-radius:10px;background:var(--panel);font:700 17px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .btn{flex:1 1 180px}
.count{margin:18px 0 0;padding:16px;border-radius:14px;background:var(--panel)}
.count .big{font-size:24px;font-weight:800;line-height:1.25;margin:0 0 8px}
.count p{margin:0 0 8px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px}
.bar i{height:12px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.bar i.on{background:var(--gold-ink);border-color:var(--gold-ink)}
.small{font-size:15px;color:var(--ink-3)}
.more{margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--line)}
.more p{margin:0 0 10px}
.foot{max-width:720px;margin:0 auto;padding:18px 16px 32px;border-top:1px solid var(--line);font-size:15px;color:var(--ink-3)}
.foot p{margin:0 0 8px}.foot a{display:inline-flex;align-items:center;min-height:44px;margin-right:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:16px;z-index:60}
.hp{position:absolute;left:-5000px}
</style>
