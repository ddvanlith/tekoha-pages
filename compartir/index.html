.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--panel-2);border-radius:12px}

.seg input{position:absolute;opacity:0;pointer-events:none}

.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.msg{min-height:24px;margin:10px 0 0;font-size:16px}
.msg.bad{color:var(--warn)}.msg.okm{color:var(--ok)}
.mylink{margin:0 0 12px;padding:14px;border:1px solid rgba(12,24,56,.09);border-radius:14px;box-shadow:0 1px 2px rgba(12,24,56,.05),0 8px 22px rgba(12,24,56,.08)}

.count .big{font-size:24px;font-weight:800;line-height:1.25;margin:0 0 8px}

.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px}
